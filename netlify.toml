[build]
  command = "yarn build"
  publish = ".next"

[functions]
  directory = ".next/server/functions"

# Document Cache-Control is set by Next.js (see async headers() in
# next.config.js), which the runtime honors over netlify.toml. Here we only
# reassert the long-lived immutable cache for hashed build assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
  cache-control = 'public,max-age=31536000,immutable'